init:
  - ps: |
      $tag = $env:APPVEYOR_REPO_TAG_NAME
      if ($tag -and $tag -match '(v\d+\.\d+\.\d+)') {
        Set-AppveyorBuildVariable 'VERSION_TAG' $matches[1]
      } elseif ($tag) {
        Set-AppveyorBuildVariable 'VERSION_TAG' $tag
      }

branches:
  only:
    - /^v\d+\.\d+\.\d+$/
    - /^windows-v\d+\.\d+\.\d+$/
    - /^linux-v\d+\.\d+\.\d+$/
    - /^macos-v\d+\.\d+\.\d+$/
    - /^android-v\d+\.\d+\.\d+$/
    - game-refactoring

for:
-
    branches:
        only:
            - /^v\d+\.\d+\.\d+$/

    image:
        - Visual Studio 2022
        - Ubuntu2204
        - macos-monterey
-
    branches:
        only:
            - /^windows-v\d+\.\d+\.\d+$/

    image:
        - Visual Studio 2022
-
    branches:
        only:
            - /^linux-v\d+\.\d+\.\d+$/

    image:
        - Ubuntu2204
-
    branches:
        only:
            - /^macos-v\d+\.\d+\.\d+$/

    image:
        - macos-monterey
-
    branches:
        only:
            - /^android-v\d+\.\d+\.\d+$/

    image:
        - Visual Studio 2022
    build:
        project: AmbermoonAndroid/AmbermoonAndroid.csproj

-
    branches:
        only:
            - game-refactoring

    image:
        - Visual Studio 2022

-
    matrix:
        only:
            - image: macos-monterey
    install:
        - |
          if ! dotnet --list-sdks 2>/dev/null | grep -q '^9\.0'; then
            curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 9.0
          fi
        - export DOTNET_ROOT="$HOME/.dotnet"
        - export PATH="$DOTNET_ROOT:$PATH"
        - dotnet --version

platform: Any CPU
configuration: Release

before_build:
  - ps: |
      if ($env:APPVEYOR_REPO_BRANCH -match '^android-v\d+\.\d+\.\d+$') {
        dotnet workload install android
        dotnet restore AmbermoonAndroid/AmbermoonAndroid.csproj
      } else {
        dotnet restore Ambermoon.net.sln --verbosity normal
      }

build:
  parallel: true
  project: Ambermoon.net.sln

artifacts:
  - path: Ambermoon.net-Windows.zip
    name: Ambermoon.net-Windows
  - path: Ambermoon.net-Windows32Bit.zip
    name: Ambermoon.net-Windows32Bit
  - path: Ambermoon.net-Linux.tar.gz
    name: Ambermoon.net-Linux
  - path: Ambermoon.net-Mac-ARM.zip
    name: Ambermoon.net-Mac-ARM
  - path: Ambermoon.net-Mac.zip
    name: Ambermoon.net-Mac
  - path: AmbermoonInstall.exe
    name: AmbermoonInstaller
  - path: com.pyrdacor.AmbermoonAndroid.apk
    name: AmbermoonAndroid
  - path: com.pyrdacor.AmbermoonAndroid-Signed.apk
    name: AmbermoonAndroidSigned
  # app bundle for the Play Store (uploaded manually, not deployed to GitHub)
  - path: com.pyrdacor.AmbermoonAndroid-Signed.aab
    name: AmbermoonAndroidBundle
  - path: nuget\*.nupkg
    name: NugetPackages

after_build:
    - ps: |
        if ($env:APPVEYOR_REPO_BRANCH -match '^android-v\d+\.\d+\.\d+$') {
          $tfm = 'net9.0-android36.0'
          $publishDir = "./AmbermoonAndroid/bin/Release/$tfm/publish"
          $signing = @()
          # Release signing for the Play Store (see docs/AndroidSigning.md). The secrets are secure
          # environment variables of the AppVeyor project and are never written to the log.
          if ($env:KEYSTORE_SECRET -and $env:KEYSTORE_SALT -and $env:ANDROID_KEYSTORE_PASS -and (Test-Path "AmbermoonAndroid/ambermoon.keystore.enc")) {
            iex ((New-Object Net.WebClient).DownloadString('https://raw.githubusercontent.com/appveyor/secure-file/master/install.ps1'))
            # the .exe explicitly, appveyor-tools also contains an extensionless bash script with the same name
            appveyor-tools\secure-file.exe -decrypt AmbermoonAndroid\ambermoon.keystore.enc -secret $env:KEYSTORE_SECRET -salt $env:KEYSTORE_SALT -out AmbermoonAndroid\ambermoon.keystore
            if ($LASTEXITCODE -ne 0) { throw "The keystore could not be decrypted (secure-file exit code $LASTEXITCODE)" }
            $signing = @('-p:AndroidKeyStore=true', '-p:AndroidSigningKeyStore=ambermoon.keystore', '-p:AndroidSigningKeyAlias=ambermoon',
              '-p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASS', '-p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASS')
          } else {
            Write-Warning "No release signing secrets available, the packages are signed with the debug key."
          }
          dotnet publish AmbermoonAndroid/AmbermoonAndroid.csproj -c Release -f $tfm -p:DefineConstants="GLES" '-p:AndroidPackageFormats=aab%3Bapk' @signing
          $publishExitCode = $LASTEXITCODE
          Remove-Item "AmbermoonAndroid/ambermoon.keystore" -ErrorAction SilentlyContinue
          if ($publishExitCode -ne 0) { throw "dotnet publish failed with exit code $publishExitCode" }
          Copy-Item "$publishDir/com.pyrdacor.AmbermoonAndroid-Signed.apk" "com.pyrdacor.AmbermoonAndroid-Signed.apk"
          Copy-Item "$publishDir/com.pyrdacor.AmbermoonAndroid-Signed.aab" "com.pyrdacor.AmbermoonAndroid-Signed.aab"
          if (Test-Path "$publishDir/com.pyrdacor.AmbermoonAndroid.apk") {
            Copy-Item "$publishDir/com.pyrdacor.AmbermoonAndroid.apk" "com.pyrdacor.AmbermoonAndroid.apk"
          }
        } else {
          if ($env:APPVEYOR_REPO_TAG -eq $true) {
            ./publish.ps1
          }
          ./nuget.ps1
        }

test: false

